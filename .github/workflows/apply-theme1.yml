name: Apply Theme 1
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-theme1.yml']
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Theme 1 without changing portfolio content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="theme1.css" />'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          banner='''<div class="top-banner"><div class="wrap"><div class="banner-shell"><img src="maddyrox-banner.jpg" alt="MADDYROX AI — Computational Neuroscience, Movement Science and Human Movement Rehabilitation" /></div></div></div>'''
          if 'class="top-banner"' not in s:
              s=s.replace('<header id="home">', banner+'\n<header id="home">')
          linkedin='https://www.linkedin.com/in/sai-narasimha-madhav-s-n-v-s-n-v-78bb21395/'
          s=s.replace('REPLACE_WITH_YOUR_LINKEDIN_URL', linkedin)
          # Add LinkedIn to overlay footer only if it is not already there.
          marker='<a href="https://github.com/snvsnmadhav" target="_blank" rel="noopener">GitHub</a>'
          if linkedin not in s.split('<header id="home">')[0]:
              s=s.replace(marker, marker+'\n    <a href="'+linkedin+'" target="_blank" rel="noopener">LinkedIn</a>',1)
          # Add a LinkedIn hero button without changing any existing hero text/buttons.
          hero_marker='<a class="btn" href="cv.pdf" target="_blank" rel="noopener">Download CV</a>'
          if 'class="btn" href="'+linkedin+'"' not in s:
              s=s.replace(hero_marker, hero_marker+'\n        <a class="btn" href="'+linkedin+'" target="_blank" rel="noopener">LinkedIn</a>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-theme1.yml
          git commit -m "Restore full content and apply Theme 1"
          git push
